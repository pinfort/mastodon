# Fork-specific Docker Compose override configuration
# This file is tracked in the repository and provides fork-specific image tags
#
# This separation prevents merge conflicts when syncing with upstream Mastodon
# Docker Compose automatically applies this override file when you run:
#   docker compose up -d

services:
  db: !reset null # prd uses database outside of docker
  redis: !reset null # prd uses redis outside of docker

  web:
    image: ghcr.io/pinfort/mastodon:hyogo_v4.4.3_v4.4.8
    depends_on: !reset []

  streaming:
    image: ghcr.io/pinfort/mastodon-streaming:hyogo_v4.4.3_v4.4.8
    depends_on: !reset []

  sidekiq:
    image: ghcr.io/pinfort/mastodon:hyogo_v4.4.3_v4.4.8
    depends_on: !reset []
